name: FDE integrated system validation
on:
  push:
    branches: [feature/full-fde-logistics-engagement]
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-networked-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test API
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Build and run all four services
        run: docker compose -f deploy/compose.yaml up --build -d --wait
      - name: Validate networked user workflows
        run: python scripts/smoke_fde.py
      - name: Show service logs if unsuccessful
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color --tail=150
      - name: Remove synthetic integration
        if: always()
        run: docker compose -f deploy/compose.yaml down --remove-orphans
