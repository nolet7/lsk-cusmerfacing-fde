services:
  aerospace-demo:
    build: ..
    ports:
      - "127.0.0.1:18641:18641"
    environment:
      DEMO_DB: /tmp/lsk_aerospace_demo.sqlite3
      # Set OPENAI_API_KEY only after enterprise approval; do not commit credentials
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18641/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
